plugins { id 'com.android.application' }

android {
    namespace 'io.github.quintond.orchestrator'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.quintond.orchestrator'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.1.0-alpha.4'
    }
    signingConfigs {
        alpha {
            if (System.getenv('ORCHESTRATOR_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ORCHESTRATOR_ANDROID_KEYSTORE'))
                storePassword System.getenv('ORCHESTRATOR_ANDROID_KEY_PASSWORD')
                keyAlias 'orchestrator-alpha'
                keyPassword System.getenv('ORCHESTRATOR_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-qa'
        }
        release {
            signingConfig signingConfigs.alpha
            // No native libraries or application runtime dependencies. Preserve useful crash stacks.
            minifyEnabled false
            debuggable false
        }
    }
    buildFeatures { buildConfig true }
    // The npm build entry point records the actual git worktree commit in the APK.
    sourceSets { main { assets.srcDir "$buildDir/generated/releaseIdentity" } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        warningsAsErrors true
        // Toolchain updates are deliberate; this pinned pair supports API 36 and JDK 17/21.
        disable 'AndroidGradlePluginVersion'
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
