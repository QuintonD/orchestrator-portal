name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: orchestrator-portal:test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm run build
      - run: npm run android:build
      - name: Release build-daemon memory before emulator QA
        run: ./gradlew --stop
        working-directory: apps/android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          # Keep the emulator reproducible and use its maintained ANGLE backend.
          # Legacy swiftshader_indirect exited during animated WebView rendering.
          emulator-build: 15507667
          # 720/280 keeps the same logical viewport as 1080/420, with 56% fewer
          # software-rendered pixels. Full-resolution native QA also runs locally.
          pre-emulator-launch-script: sed -i -E -e 's/^hw.lcd.density[[:space:]]*=.*/hw.lcd.density=280/' -e 's/^hw.lcd.width[[:space:]]*=.*/hw.lcd.width=720/' -e 's/^hw.lcd.height[[:space:]]*=.*/hw.lcd.height=1600/' "$ANDROID_AVD_HOME/test.avd/config.ini"
          emulator-options: -no-window -gpu swangle -feature -Vulkan -cores 4 -skin 720x1600 -noaudio -no-boot-anim -no-snapshot
          script: ANDROID_QA_SERIAL=emulator-5554 npm run test:android
      - name: Diagnose emulator host failure
        if: failure()
        run: |
          free -h
          ps -eo pid,comm,rss --sort=-rss | head -n 20
          sudo dmesg | tail -n 160
          sudo grep -h -A 8 -E '^(ExecutablePath|Signal|StacktraceTop|Title):' /var/crash/*.crash || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-qa
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/lint-results-debug.html
            test-results/android/**/*.png
            test-results/android/**/failure-*.txt
            test-results/android/**/results.json
